<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CELLILAB</title>
<meta name="description" content="CELLILAB, Dott. Renato Celli">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0F2E42;--acc:#84e8d8;--soft:#bcd5de;--rule:rgba(188,213,222,.32);--fg:#fff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--fg);font-family:Inter,system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:32px 20px}
main{max-width:560px;width:100%;text-align:center}
h1{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:clamp(44px,12vw,72px);letter-spacing:.06em;margin:0}
p.sub{color:var(--soft);letter-spacing:.12em;text-transform:uppercase;font-size:13px;margin:8px 0 40px}
a.card{display:block;text-decoration:none;color:var(--fg);border:1px solid var(--rule);border-radius:10px;padding:22px 20px;transition:border-color .2s}
a.card:hover{border-color:var(--acc)}
a.card b{display:block;font-family:"Barlow Condensed",sans-serif;font-size:24px;letter-spacing:.04em;text-transform:uppercase}
a.card span{color:var(--soft);font-size:14px}
a.card em{display:inline-block;margin-top:12px;color:var(--acc);font-style:normal;font-weight:500;font-size:14px}
footer{margin-top:48px;color:var(--soft);font-size:12px}
</style>
</head>
<body>
<main>
<h1>CELLILAB</h1>
<p class="sub">Dott. Renato Celli</p>
<a class="card" href="/guida-ai-telemedicina/">
<b>Guida operativa per l'infermiere</b>
<span>Intelligenza artificiale e telemedicina in ortopedia</span><br>
<em>Consulta la guida →</em>
</a>
<footer>© 2026 Renato Celli</footer>
</main>
</body>
</html>
